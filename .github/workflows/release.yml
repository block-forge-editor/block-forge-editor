name: Release

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: ./.github/actions/setup-node

      - name: Run tests
        run: yarn test

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: ./.github/actions/setup-node

      - name: Build package
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: dist/
          retention-days: 1

  release:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # release commit, tag and GitHub release
      issues: write # comments on released issues
      pull-requests: write # comments on released pull requests
      id-token: write # npm trusted publishing (OIDC), no npm token needed
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: ./.github/actions/setup-node

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          path: dist/

      # Publishes through npm trusted publishing when the package has this
      # workflow set as its trusted publisher on npmjs.com. Otherwise it falls
      # back to an npm token from the NPM_TOKEN (or legacy NODE_AUTH_TOKEN) secret.
      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN || secrets.NODE_AUTH_TOKEN }}
        run: npx semantic-release
